<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Casa Tamara — PLANO:CQ</title>
    <style>html, body { margin: 0; min-height: 100%; background: #101010; }</style>
  </head>
  <body>
    <script>
      fetch("/casa-tamara.html")
        .then((response) => {
          if (!response.ok) throw new Error("No se pudo cargar el proyecto");
          return response.text();
        })
        .then((html) => {
          const internalHtml = html
            .replaceAll('href="/"', 'href="/revision/interna/"')
            .replaceAll('href="/#', 'href="/revision/interna/#');
          document.open();
          document.write(internalHtml);
          document.close();
        });
    </script>
  </body>
</html>
