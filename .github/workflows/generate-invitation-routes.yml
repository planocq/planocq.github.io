name: Validate unique link generator

on:
  push:
    paths:
      - "tools/unique_link.py"
      - "tools/test_unique_link.py"
      - ".github/workflows/generate-invitation-routes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the sole supported generator (no route writes)
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
